<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{nombre}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#1c1512;--char-2:#2a201b;--ember:#d5622d;--ember-2:#e8853f;
    --cream:#f6efe4;--cream-2:#efe4d2;--sage:#6b7a52;--gold:#c99a4b;
    --ink:#2a201b;--muted:#7c6c5f;--line:#e3d6c3;--card:#fffdf9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Manrope",sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;-webkit-text-size-adjust:100%}
  h1,h2,h3,.disp{font-family:"Fraunces",serif}

  header{position:sticky;top:0;z-index:40;background:rgba(28,21,18,.96);backdrop-filter:blur(8px);
    color:var(--cream);padding:12px 18px;display:flex;align-items:center;gap:12px}
  .logo{font-family:"Fraunces";font-weight:600;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .logo .fire{color:var(--ember-2)}
  .status{margin-left:auto;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .status .dot{width:7px;height:7px;border-radius:50%}
  .status.open{background:rgba(107,122,82,.22);color:#bcd39a}.status.open .dot{background:#8fce5a;box-shadow:0 0 0 3px rgba(143,206,90,.25)}
  .status.closed{background:rgba(213,98,45,.2);color:#f0a878}.status.closed .dot{background:var(--ember-2)}

  .hero{position:relative;background:linear-gradient(180deg,var(--char) 0%,var(--char-2) 100%);color:var(--cream);
    padding:48px 22px 54px;text-align:center;overflow:hidden}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:34px;background:var(--cream);
    border-radius:100% 100% 0 0/100% 100% 0 0}
  .smoke{position:absolute;inset:0;opacity:.5;background:
    radial-gradient(40% 30% at 20% 15%,rgba(213,98,45,.35),transparent),
    radial-gradient(45% 35% at 85% 25%,rgba(201,154,75,.25),transparent)}
  .hero-in{position:relative;z-index:1}
  .kick{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ember-2);font-weight:700}
  .hero h1{font-size:clamp(40px,13vw,64px);font-weight:600;line-height:.98;margin:14px 0 6px;letter-spacing:-.5px}
  .hero .amp{font-style:italic;color:var(--ember-2)}
  .hero .tag{font-family:"Fraunces";font-style:italic;font-size:18px;color:var(--cream-2)}
  .hero-meta{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12.5px}
  .chip{background:rgba(246,239,228,.1);border:1px solid rgba(246,239,228,.2);padding:6px 13px;border-radius:999px;font-weight:600}

  .wrap{max-width:620px;margin:0 auto;padding:0 16px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 26px;position:relative;z-index:2}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;
    font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:none;font-family:inherit}
  .btn-primary{background:var(--ember);color:#fff;box-shadow:0 8px 20px rgba(213,98,45,.32)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
  .btn:active{transform:translateY(1px)}

  .menu-nav{position:sticky;top:52px;z-index:30;background:var(--cream);padding:12px 0 10px;
    display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .menu-nav::-webkit-scrollbar{display:none}
  .menu-nav button{flex:none;background:var(--card);border:1.5px solid var(--line);color:var(--muted);
    padding:8px 15px;border-radius:999px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .menu-nav button.active{background:var(--char);color:var(--cream);border-color:var(--char)}

  .cat{padding-top:14px;scroll-margin-top:104px}
  .cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .cat-head h2{font-size:26px;font-weight:600}
  .cat-head .ln{flex:1;height:1px;background:var(--line)}
  .cat-head .em{font-size:20px}

  .dish{display:flex;gap:14px;padding:15px 0;border-bottom:1px dashed var(--line)}
  .dish:last-child{border-bottom:none}
  .dish-img{width:66px;height:66px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:linear-gradient(135deg,var(--cream-2),#e6d3b8)}
  .dish-body{flex:1;min-width:0}
  .dish-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .dish-name{font-family:"Fraunces";font-weight:600;font-size:16.5px;line-height:1.2}
  .dish-price{font-family:"Fraunces";font-weight:600;font-size:16px;color:var(--ember);white-space:nowrap}
  .dish-desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .tagline{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sage);background:rgba(107,122,82,.12);padding:3px 8px;border-radius:6px}
  .tagline.pop{color:var(--ember);background:rgba(213,98,45,.12)}

  .infocard{margin:30px 0 0;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px}
  .infocard h3{font-size:20px;font-weight:600;margin-bottom:12px}
  .inforow{display:flex;gap:12px;padding:9px 0;font-size:13.5px;align-items:flex-start}
  .inforow svg{flex:none;margin-top:2px;color:var(--ember)}
  .inforow b{font-weight:700}
  .hours-today{color:var(--sage);font-weight:700}

  .hecho{text-align:center;padding:22px 20px calc(26px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--muted)}
  .hecho a{color:inherit;font-weight:700}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="fire" data-negocio="icono"></span> <span data-negocio="nombre"></span></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">—</span></div>
</header>

<section class="hero" data-negocio-portada>
  <div class="smoke"></div>
  <div class="hero-in">
    <div class="kick" data-negocio="giro"></div>
    <h1 data-negocio="nombreAmp"></h1>
    <p class="tag" data-negocio="eslogan"></p>
    <div class="hero-meta" data-negocio="distintivos"></div>
  </div>
</section>

<div class="wrap">
  <div class="actions">
    <a class="btn btn-primary" id="reservar" data-negocio-wa="Hola 👋 Quiero reservar una mesa en {nombre}." target="_blank" rel="noopener">Reservar mesa</a>
    <a class="btn btn-ghost" id="ubicacion" data-negocio-mapa target="_blank" rel="noopener">Cómo llegar</a>
  </div>

  <div data-negocio="galeria" style="margin-top:18px"></div>
  <nav class="menu-nav" id="menuNav"></nav>
  <div id="menu"></div>

  <div data-negocio="resenas"></div>
  <div class="infocard">
    <h3>Visítanos</h3>
    <div class="inforow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <div><b data-negocio="direccion"></b><br><span data-negocio="colonia"></span></div>
    </div>
    <div class="inforow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div id="hoursBlock"></div>
    </div>
    <div class="inforow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
      <div><b>Reservas y pedidos</b><br>WhatsApp <span data-negocio="whatsappVisible"></span></div>
    </div>
  </div>
</div>

<footer class="hecho">Página hecha por <a href="https://solidaaplicaciones.com" target="_blank" rel="noopener">Solida Aplicaciones</a></footer>

<script src="../datos.js"></script>
<script src="../plantilla.js"></script>
<script>
// Menú y horarios salen de datos.js
const esc=NEGOCIO.esc;
const MENU=Object.fromEntries(NEGOCIO.menu.map(c=>[c.categoria,{em:c.icono,items:c.platillos.map(x=>({n:x.nombre,d:x.desc,p:NEGOCIO.pesos(x.precio),t:x.etiqueta,pop:x.destacado,img:x.icono,foto:x.foto}))}]));
const HOURS=NEGOCIO.horarios;
const now=new Date();const dow=(now.getDay()+6)%7;const h=now.getHours()+now.getMinutes()/60;
const today=HOURS[dow];const isOpen=today[2]!==null&&h>=today[2]&&h<today[3];
const st=document.getElementById('status');
st.className='status '+(isOpen?'open':'closed');
document.getElementById('statusText').textContent=isOpen?'Abierto ahora':'Cerrado';
document.getElementById('hoursBlock').innerHTML='<b>Hoy ('+esc(today[0])+'):</b> <span class="hours-today">'+esc(today[1])+'</span><br>'+
  HOURS.filter((_,i)=>i!==dow).map(r=>esc(r[0])+' · '+esc(r[1])).join('<br>');

// Render menu
const nav=document.getElementById('menuNav');const menu=document.getElementById('menu');
Object.entries(MENU).forEach(([cat,data],i)=>{
  const id='cat-'+i;
  const b=document.createElement('button');b.textContent=cat;b.dataset.target=id;if(i===0)b.classList.add('active');
  b.onclick=()=>{document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});};
  nav.appendChild(b);
  const sec=document.createElement('section');sec.className='cat';sec.id=id;
  sec.innerHTML='<div class="cat-head"><span class="em">'+esc(data.em)+'</span><h2>'+esc(cat)+'</h2><span class="ln"></span></div>'+
    data.items.map(it=>`<div class="dish"><div class="dish-img">${it.foto?NEGOCIO.imgHtml(it.foto,it.n):esc(it.img)}</div><div class="dish-body">
      <div class="dish-top"><div class="dish-name">${esc(it.n)}</div><div class="dish-price">${esc(it.p)}</div></div>
      <div class="dish-desc">${esc(it.d)}</div>${it.t?`<span class="tagline${it.pop?' pop':''}">${esc(it.t)}</span>`:''}</div></div>`).join('');
  menu.appendChild(sec);
});
// Scroll spy
const secs=[...document.querySelectorAll('.cat')];const btns=[...nav.querySelectorAll('button')];
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){
  const id=e.target.id;btns.forEach(b=>b.classList.toggle('active',b.dataset.target===id));
  const ab=btns.find(b=>b.dataset.target===id);if(ab)ab.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}});},{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>io.observe(s));
</script>
</body>
</html>
